# Line coverage of the complete test suite (NOT_CRAN=true), measured with
# covr by tools/coverage.R and uploaded to Codecov for the README badge.
name: test-coverage

# Same triggers as R-CMD-check: only on main, when dev is merged into it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::covr any::xml2
          needs: coverage
      - name: Check the coverage helper
        run: Rscript --vanilla tools/test-coverage.R
      - name: Measure coverage
        env:
          TMPDIR: ${{ runner.temp }}
        run: Rscript --vanilla tools/coverage.R 4 "$RUNNER_TEMP/coverage"
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ${{ runner.temp }}/coverage/cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            ${{ runner.temp }}/coverage/*.xml
            ${{ runner.temp }}/coverage/*.csv
            ${{ runner.temp }}/coverage/*.log
            ${{ runner.temp }}/coverage/package/*.Rout*
