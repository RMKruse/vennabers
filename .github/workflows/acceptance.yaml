name: acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    name: R ${{ matrix.r }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        r: ["4.1.3", "release"]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - run: Rscript tools/acceptance.R
