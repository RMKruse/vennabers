name: acceptance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run the separate serial Linux benchmark and v0.4 comparison
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
      - name: Build one source candidate
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          R CMD build "$GITHUB_WORKSPACE" > build.log 2>&1
          cat build.log
          if grep -E '\b(ERROR|WARNING|NOTE)\b' build.log; then exit 1; fi
          sha256sum vennabers_*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-candidate
          path: |
            ${{ runner.temp }}/vennabers_*.tar.gz
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/build.log

  acceptance:
    needs: source
    name: R ${{ matrix.r }} / ${{ matrix.platform.os }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os }}
    continue-on-error: ${{ matrix.r == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        r: ["4.6.1", "4.5.3"]
        platform:
          - {os: ubuntu-24.04, arch: x86_64, runner-arch: X64}
          - {os: windows-2025, arch: x86_64, runner-arch: X64}
          - {os: macos-15-intel, arch: x86_64, runner-arch: X64}
          - {os: macos-15, arch: aarch64, runner-arch: ARM64}
        include:
          - r: devel
            platform: {os: ubuntu-24.04, arch: x86_64, runner-arch: X64}
    env:
      EXPECTED_R_ARCH: ${{ matrix.platform.arch }}
      ACCEPTANCE_OUTPUT_DIR: ${{ github.workspace }}/.scratch/ci
      ACCEPTANCE_ARTIFACT: ${{ github.workspace }}/.scratch/source/vennabers_0.5.0.tar.gz
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: actions/download-artifact@v4
        with:
          name: source-candidate
          path: .scratch/source
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"Suggests"'
          upgrade: 'TRUE'
      - name: Verify source identity
        shell: bash
        working-directory: .scratch/source
        run: sha256sum -c SHA256SUMS
      - name: Verify runner architecture
        shell: Rscript {0}
        run: stopifnot(Sys.getenv("RUNNER_ARCH") == "${{ matrix.platform.runner-arch }}")
      - name: Check installed package
        run: Rscript --vanilla tools/acceptance.R
      - name: Verify failures propagate
        if: matrix.r == '4.6.1' && (matrix.platform.os == 'ubuntu-24.04' || matrix.platform.os == 'windows-2025')
        run: Rscript --vanilla tools/test-acceptance.R
      - name: Verify missing and old optional dependency errors
        shell: bash
        run: Rscript --vanilla tools/test-optional-dependencies.R "$ACCEPTANCE_ARTIFACT" > "$ACCEPTANCE_OUTPUT_DIR/optional-dependencies.log" 2>&1
      - name: Preserve evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.r }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          include-hidden-files: true
          path: |
            .scratch/ci/*.txt
            .scratch/ci/*.log
            .scratch/ci/*.tar.gz
            .scratch/ci/*.Rcheck

  optional-dependencies:
    needs: source
    name: Optional dependencies / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: core, r: "4.6.1"}
          - {profile: minimum, r: "4.5.3"}
    env:
      ACCEPTANCE_PROFILE: ${{ matrix.profile }}
      EXPECTED_R_ARCH: x86_64
      ACCEPTANCE_OUTPUT_DIR: ${{ github.workspace }}/.scratch/ci
      ACCEPTANCE_ARTIFACT: ${{ github.workspace }}/.scratch/source/vennabers_0.5.0.tar.gz
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - uses: actions/download-artifact@v4
        with:
          name: source-candidate
          path: .scratch/source
      - name: Verify source identity
        working-directory: .scratch/source
        run: sha256sum -c SHA256SUMS
      - name: Install pinned minimum environment
        if: matrix.profile == 'minimum'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev
          Rscript --vanilla tools/install-minimum-dependencies.R "$R_LIBS_USER" 2>&1 | tee .scratch/minimum-setup.log
      - name: Check installed package and dependency profile
        run: Rscript --vanilla tools/acceptance.R
      - name: Verify missing and old optional dependency errors
        run: Rscript --vanilla tools/test-optional-dependencies.R "$ACCEPTANCE_ARTIFACT" > "$ACCEPTANCE_OUTPUT_DIR/optional-dependencies.log" 2>&1
      - name: Preserve evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.profile }}
          include-hidden-files: true
          path: |
            .scratch/minimum-setup.log
            .scratch/ci/*.txt
            .scratch/ci/*.log
            .scratch/ci/*.tar.gz
            .scratch/ci/*.Rcheck

  benchmarks:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
      - uses: actions/download-artifact@v4
        with:
          name: source-candidate
          path: .scratch/source
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"Suggests"'
          upgrade: 'TRUE'
      - name: Verify candidate and approved predecessor identities
        shell: bash
        run: |
          (cd .scratch/source && sha256sum -c SHA256SUMS)
          echo '44846f1e2a6cd5ec1672264516122e5d26e65a2a18f69ec1d5fb7078514ddb69  tools/evidence-v04/vennabers_0.4.0.tar.gz' | sha256sum -c -
      - name: Measure both releases serially on this runner
        run: Rscript --vanilla tools/performance.R .scratch/source/vennabers_0.5.0.tar.gz tools/evidence-v04/vennabers_0.4.0.tar.gz .scratch/benchmark
      - name: Verify measurements and failure detection
        run: |
          Rscript --vanilla tools/test-performance.R .scratch/benchmark --v05
          Rscript --vanilla tools/test-performance-verifier.R .scratch/benchmark
      - name: Record evidence identities
        if: always()
        shell: bash
        run: |
          if test -d .scratch/benchmark; then
            cd .scratch/benchmark
            find . -type f ! -path '*-library/*' ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          fi
      - name: Preserve benchmark evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          include-hidden-files: true
          path: |
            .scratch/benchmark/*
            !.scratch/benchmark/*-library/**
