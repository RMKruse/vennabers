# CI matrix from RELEASE-ROADMAP.md, section 3.2: one source package, checked
# with R CMD check --as-cran and the complete test suite on the eight required
# platform/R combinations, plus R-devel (early warning), the manual core
# without tidymodels and the declared minimum versions of the optional
# integration packages.
name: R-CMD-check

# main is the release branch; dev collects feature and fix pull requests.
# The matrix runs when dev is proposed for or merged into main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Release-branch runs are evidence; let them finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # tests/testthat.R runs the short CRAN test profile unless NOT_CRAN is true;
  # tools/verify.R runs the complete suite separately.
  NOT_CRAN: false
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  source:
    name: Build source package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
      - name: Check the CI helpers
        run: |
          for test in tools/test-ci-check.R tools/test-ci-environment.R tools/test-minimum-dependencies.R; do
            Rscript --vanilla "$test"
          done
      - name: Build
        working-directory: ${{ runner.temp }}
        run: |
          mkdir source && cd source
          R CMD build "$GITHUB_WORKSPACE" 2>&1 | tee build.log
          if grep -E '\b(ERROR|WARNING|NOTE)\b' build.log; then exit 1; fi
          sha256sum vennabers_*.tar.gz | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: ${{ runner.temp }}/source

  check:
    needs: source
    name: ${{ matrix.os }} (R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    # R-devel is an early warning and does not block a release.
    continue-on-error: ${{ matrix.r == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
        r: [release, oldrel-1]
        include:
          - {os: ubuntu-24.04, r: devel, http-user-agent: release}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      # Fonts, styles and the index program of the PDF manual that TinyTeX
      # leaves out. Without makeindex, Rd2pdf fails on Windows and R-devel.
      - name: Install LaTeX packages
        run: tlmgr install inconsolata cm-super ec rsfs jknapltx times makeindex
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: ${{ matrix.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::rcmdcheck
      - name: Confirm the runner architecture
        shell: Rscript {0}
        run: stopifnot(R.version$arch == if ("${{ matrix.os }}" == "macos-15") "aarch64" else "x86_64")
      - uses: actions/download-artifact@v4
        with:
          name: source-package
          path: ${{ runner.temp }}/source
      - name: Record package versions
        shell: bash
        run: Rscript --vanilla tools/ci-environment.R "$RUNNER_TEMP/evidence"
      - name: Check source package
        shell: bash
        run: Rscript --vanilla tools/ci-check.R "$RUNNER_TEMP/source" "$RUNNER_TEMP/check"
      # The short CRAN profile leaves out most workflow tests; run all of them.
      - name: Run the complete test suite
        shell: bash
        working-directory: ${{ runner.temp }}/source
        env:
          TMPDIR: ${{ runner.temp }}
        run: Rscript --vanilla "$GITHUB_WORKSPACE/tools/verify.R" 4 vennabers_*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.os }}-r-${{ matrix.r }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/check/vennabers.Rcheck/00*
            ${{ runner.temp }}/check/vennabers.Rcheck/Rdlatex.log
            ${{ runner.temp }}/check/vennabers.Rcheck/vennabers-manual.*
            ${{ runner.temp }}/check/vennabers.Rcheck/tests/*.Rout*
            ${{ runner.temp }}/vennabers-verify-*/*.log
            ${{ runner.temp }}/vennabers-verify-*/*.csv

  core:
    needs: source
    name: Manual core without tidymodels
    runs-on: ubuntu-24.04
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::knitr any::rmarkdown any::testthat any::rcmdcheck
          # A cached library from another job would bring back the Suggests.
          cache: false
      - name: Confirm tidymodels is absent
        shell: Rscript {0}
        run: |
          integration <- c("parsnip", "workflows", "hardhat", "rsample", "recipes",
            "tailor", "probably", "tune", "dials", "yardstick")
          present <- integration[vapply(integration, requireNamespace, logical(1), quietly = TRUE)]
          if (length(present)) stop("Installed integration packages: ", toString(present))
      - uses: actions/download-artifact@v4
        with:
          name: source-package
          path: ${{ runner.temp }}/source
      - name: Record package versions
        run: Rscript --vanilla tools/ci-environment.R "$RUNNER_TEMP/evidence"
      # The vignettes still evaluate optional packages unconditionally (#46);
      # the PDF manual is checked on the required matrix.
      - name: Check source package
        run: Rscript --vanilla tools/ci-check.R "$RUNNER_TEMP/source" "$RUNNER_TEMP/check" --ignore-vignettes --no-manual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-core
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/check/vennabers.Rcheck/00*
            ${{ runner.temp }}/check/vennabers.Rcheck/tests/*.Rout*

  minimum:
    needs: source
    name: Minimum integration versions (R oldrel-1)
    runs-on: ubuntu-24.04
    env:
      # The day after the newest declared minimum (recipes 1.4.0) reached CRAN.
      # Move it forward when DESCRIPTION raises a minimum beyond this date.
      SNAPSHOT: https://packagemanager.posit.co/cran/__linux__/noble/2026-08-25
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: oldrel-1
          use-public-rspm: false
      - name: Install pak
        shell: Rscript {0}
        run: |
          install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s",
            .Platform$pkgType, R.Version()$os, R.Version()$arch))
      - name: Install declared minimum versions
        run: Rscript --vanilla tools/minimum-dependencies.R "$SNAPSHOT" "$RUNNER_TEMP/evidence"
      - uses: actions/download-artifact@v4
        with:
          name: source-package
          path: ${{ runner.temp }}/source
      - name: Record package versions
        run: Rscript --vanilla tools/ci-environment.R "$RUNNER_TEMP/evidence"
      - name: Check source package
        run: Rscript --vanilla tools/ci-check.R "$RUNNER_TEMP/source" "$RUNNER_TEMP/check" --no-manual
      - name: Run the complete test suite
        working-directory: ${{ runner.temp }}/source
        env:
          TMPDIR: ${{ runner.temp }}
        run: Rscript --vanilla "$GITHUB_WORKSPACE/tools/verify.R" 4 vennabers_*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-minimum
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/check/vennabers.Rcheck/00*
            ${{ runner.temp }}/check/vennabers.Rcheck/tests/*.Rout*
            ${{ runner.temp }}/vennabers-verify-*/*.log
            ${{ runner.temp }}/vennabers-verify-*/*.csv
